[package]
name = "zeroclaw-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Durable task control plane for ZeroClaw runtime supervision."
publish = false

[dependencies]
zeroclaw-log.workspace = true
zeroclaw-spawn.workspace = true
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

[dev-dependencies]
tempfile = "3.26"
